name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    name: Format, compile, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.0"
          otp-version: "28.3"
      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: MIX_ENV=test mix compile --warnings-as-errors
      - run: mix test
      - run: mix credo --strict

  moqtail-draft-18:
    name: MOQtail draft-18 interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.0"
          otp-version: "28.3"
      - run: mix deps.get
      - run: scripts/run-moqtail-draft18-integration

  curley-moq-lite-05:
    name: Curley MoQ Lite 05 interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.0"
          otp-version: "28.3"
      - run: mix deps.get
      - run: scripts/run-curley-moq-lite-05-integration
